<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Game Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .game-card {
            background-color: #2a2a35;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .game-card h3 {
            margin-top: 0;
        }
        .game-btn {
            display: inline-block;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .game-btn:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>

    <header>
        <h1>My HTML5 Gaming Portal</h1>
        <p>Select a game to play locally.</p>
    </header>

    <main class="game-grid">
        <!-- Example Game Card 1 -->
        <div class="game-card">
            <h3>Custom Game 1</h3>
            <p>A local web-based game.</p>
            <button class="game-btn" onclick="checkAccess('game1.html')">Play</button>
        </div>

        <!-- Example Game Card 2 -->
        <div class="game-card">
            <h3>Custom Game 2</h3>
            <p>Another local web game.</p>
            <button class="game-btn" onclick="checkAccess('game2.html')">Play</button>
        </div>
    </main>

    <script>
        // Simple front-end gatekeeping logic
        function checkAccess(gameUrl) {
            const password = prompt("Enter the room password to access this game:");
            // Replace 'secret123' with your desired password
            if (password === "secret123") {
                window.location.href = gameUrl;
            } else {
                alert("Incorrect password. Access denied.");
            }
        }
    </script>

</body>
</html>
